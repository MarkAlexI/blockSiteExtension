name: Extension CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Run tests and validation
        run: npm run check

      - name: Build store package
        run: npm run package:store

      - name: Upload store package
        uses: actions/upload-artifact@v4
        with:
          name: blockdistraction-store-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14