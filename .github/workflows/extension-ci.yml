name: Extension CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Run tests and validation
        run: npm run check

      - name: Build CWS and Edge packages
        run: npm run package:stores

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: blockdistraction-cws-${{ github.sha }}
          path: |
            dist/*-cws.zip
            dist/*-cws.zip.sha256
            dist/*-cws.zip.build.json
          retention-days: 14

      - name: Upload Edge Add-ons package
        uses: actions/upload-artifact@v4
        with:
          name: blockdistraction-edge-${{ github.sha }}
          path: |
            dist/*-edge.zip
            dist/*-edge.zip.sha256
            dist/*-edge.zip.build.json
          retention-days: 14
