name: Chromium extension E2E

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: chromium-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    name: scenarios (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [core, lifecycle, overdue, upgrade]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install test dependencies
        timeout-minutes: 2
        working-directory: e2e
        run: npm ci
      - name: Install Linux dependencies
        timeout-minutes: 5
        working-directory: e2e
        run: |
          # The runner's first APT mirror stalled before tests in run 40307908607.
          # Keep its mirror transport and signature checks, using official HTTPS archives.
          test -f /etc/apt/apt-mirrors.txt
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/80blockdistraction-ci <<'APT'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT::Update::Error-Mode "any";
          APT
          npx playwright install-deps chromium
          sudo apt-get install --no-install-recommends -y openbox x11-utils xdotool
      - name: Install Chromium
        timeout-minutes: 2
        working-directory: e2e
        run: npx playwright install --no-shell chromium
      - name: Prepare native audio output
        if: matrix.group == 'core'
        timeout-minutes: 2
        run: |
          sudo apt-get install -y pulseaudio
          bash e2e/start-audio.sh
      - name: Build and unpack the CWS package
        run: |
          npm run package:cws
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          target = Path(os.environ['RUNNER_TEMP']) / 'bd-e2e-extension'
          archive = next(Path('dist').glob('*-cws.zip'))
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              package.extractall(target)
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f'BD_EXTENSION_PATH={target}\n')
          PY
      - name: Prepare pinned previous-version runtime
        if: matrix.group == 'upgrade'
        timeout-minutes: 2
        run: node e2e/prepare-upgrade-baseline.mjs
      - name: Run extension scenarios
        working-directory: e2e
        env:
          BD_E2E_GROUP: ${{ matrix.group }}
        run: xvfb-run -a npm test
      - name: Upload reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-chromium-e2e-${{ github.sha }}-${{ matrix.group }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/results.json
            dist/*-cws.zip.sha256
            dist/*-cws.zip.build.json
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: macos-smoke (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    env:
      BD_E2E_GROUP: macos-smoke
      BD_EXPECTED_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Record and validate native macOS runner
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import os from 'node:os';
          const evidence = { platform: process.platform, architecture: process.arch,
            expectedArchitecture: process.env.BD_EXPECTED_ARCH, node: process.version,
            osVersion: os.version(), osRelease: os.release(), imageVersion: process.env.ImageVersion,
            group: process.env.BD_E2E_GROUP };
          await writeFile('e2e/macos-environment.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(evidence);
          assert.equal(evidence.platform, 'darwin');
          assert.equal(evidence.architecture, evidence.expectedArchitecture);
          JS
      - name: Install test dependencies
        timeout-minutes: 3
        working-directory: e2e
        run: npm ci
      - name: Install pinned Playwright Chromium for native architecture
        timeout-minutes: 4
        working-directory: e2e
        run: npx playwright install --no-shell chromium
      - name: Build and unpack the CWS runtime package
        run: |
          npm run package:cws
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          target = Path(os.environ['RUNNER_TEMP']) / 'bd-e2e-extension'
          archive, = Path('dist').glob('*-cws.zip')
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              package.extractall(target)
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f'BD_EXTENSION_PATH={target}\n')
          PY
      - name: Run 24 headed macOS acceptance scenarios
        timeout-minutes: 15
        working-directory: e2e
        run: npm test
      - name: Require all 24 native scenario bodies to pass
        run: node e2e/verify-macos-result.mjs
      - name: Upload macOS result and runtime provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-chromium-macos-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            e2e/results.json
            e2e/macos-environment.json
            dist/*-cws.zip.sha256
            dist/*-cws.zip.build.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload macOS failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: bd-chromium-macos-failure-${{ github.sha }}-${{ matrix.architecture }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # Preserve the required-check name; Linux and both macOS architectures must pass.
  e2e:
    if: ${{ always() }}
    needs: [scenarios, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require Linux groups and both macOS smoke jobs
        env:
          SCENARIO_RESULT: ${{ needs.scenarios.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$SCENARIO_RESULT" = success
          test "$MACOS_RESULT" = success
